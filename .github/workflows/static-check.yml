name: Static Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install static-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run Soridormi static checks
        run: ./scripts/ci_static_check.sh

      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.sim.yaml config
          docker compose -f compose.orin.yaml config
          docker compose -f compose.thor.yaml config
