name: Repository Governance and Body Concurrency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused validation dependencies
        run: python -m pip install -e '.[dev,mcp,runtime]'

      - name: Validate semantic repository contracts
        run: python scripts/validate_repository_governance.py

      - name: Validate concurrent body execution
        run: ./scripts/validate_body_concurrency.sh
