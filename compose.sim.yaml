services:
  runtime:
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
      args:
        BASE_IMAGE: ${RUNTIME_DEV_BASE:-nvidia/cuda:13.1.2-cudnn-devel-ubuntu24.04}
        RUNTIME_EXTRA: ${RUNTIME_DEV_EXTRA:-runtime-gpu}
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
        USERNAME: ${CONTAINER_USER:-chromie}
    image: soridormi-runtime:cuda13.1-cudnn-dev
    container_name: soridormi-runtime-dev
    stdin_open: true
    tty: true
    init: true
    network_mode: host
    ipc: host
    environment:
      SORIDORMI_BACKEND: sim
      SIM_HOST: ${SIM_HOST:-127.0.0.1}
      SIM_PORT: ${SIM_PORT:-5555}
      CONTROL_HZ: ${CONTROL_HZ:-50}
      POLICY_PATH: /workspaces/Open_Duck_Mini/BEST_WALK_ONNX_2.onnx
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      SORIDORMI_ONNXRUNTIME_GPU: ${SORIDORMI_ONNXRUNTIME_GPU:-1}
      SORIDORMI_USE_CUDA_PROVIDER: ${SORIDORMI_USE_CUDA_PROVIDER:-1}
      SORIDORMI_ROBOT_CONFIG: ${SORIDORMI_ROBOT_CONFIG:-/app/configs/robots/open_duck_mini_v2.yaml}
      MUJOCO_MODEL_PATH: ${MUJOCO_MODEL_PATH:-}
      PYTHONUNBUFFERED: "1"
      SORIDORMI_RUNTIME_MODE: ${SORIDORMI_RUNTIME_MODE:-hold}
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./workspace/Open_Duck_Mini:/workspaces/Open_Duck_Mini
      - ./workspace/Open_Duck_Mini_Runtime:/workspaces/Open_Duck_Mini_Runtime
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /app
    command: bash

  sim:
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
      args:
        BASE_IMAGE: ${SIM_BASE:-nvidia/cuda:13.1.2-cudnn-devel-ubuntu24.04}
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
        USERNAME: ${CONTAINER_USER:-chromie}
    image: soridormi-sim:cuda13.1-cudnn
    container_name: soridormi-sim
    stdin_open: true
    tty: true
    init: true
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      MUJOCO_GL: glfw
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      SIM_HOST: 0.0.0.0
      SIM_PORT: ${SIM_PORT:-5555}
      SORIDORMI_SIM_BACKEND: ${SORIDORMI_SIM_BACKEND:-fake}
      SORIDORMI_MUJOCO_VIEWER: ${SORIDORMI_MUJOCO_VIEWER:-0}
      SORIDORMI_ROBOT_CONFIG: ${SORIDORMI_ROBOT_CONFIG:-/app/configs/robots/open_duck_mini_v2.yaml}
      MUJOCO_MODEL_PATH: ${MUJOCO_MODEL_PATH:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./workspace/Open_Duck_Mini:/workspaces/Open_Duck_Mini
      - ./workspace/Open_Duck_Playground:/workspaces/Open_Duck_Playground
      - ./data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /app
    command: bash

  tensorboard:
    image: soridormi-sim:cuda13.1-cudnn
    container_name: soridormi-tensorboard
    depends_on:
      - sim
    network_mode: host
    volumes:
      - ./workspace/Open_Duck_Playground:/workspaces/Open_Duck_Playground
      - ./data:/data
    command: >
      bash -lc "source /opt/venvs/sim/bin/activate &&
      tensorboard --host 0.0.0.0 --port 6006
      --logdir /workspaces/Open_Duck_Playground,/data"
    profiles:
      - tools
