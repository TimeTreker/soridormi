services:
  runtime:
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
      args:
        BASE_IMAGE: ${RUNTIME_DEV_BASE:-nvidia/cuda:13.1.2-cudnn-devel-ubuntu24.04}
        RUNTIME_EXTRA: ${RUNTIME_DEV_EXTRA:-runtime-gpu}
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
        USERNAME: ${CONTAINER_USER:-chromie}
    image: soridormi-runtime:cuda13.1-cudnn-dev
    container_name: soridormi-runtime-dev
    stdin_open: true
    tty: true
    init: true
    network_mode: host
    ipc: host
    environment:
      SORIDORMI_BACKEND: sim
      SIM_HOST: ${SIM_HOST:-127.0.0.1}
      SIM_PORT: ${SIM_PORT:-5555}
      CONTROL_HZ: ${CONTROL_HZ:-50}
      SORIDORMI_RUNTIME_MODE: ${SORIDORMI_RUNTIME_MODE:-hold}
      SORIDORMI_STAND_RAMP_SECONDS: ${SORIDORMI_STAND_RAMP_SECONDS:-3.0}
      SORIDORMI_RUNTIME_LOG: ${SORIDORMI_RUNTIME_LOG:-0}
      SORIDORMI_RUNTIME_LOG_FORMAT: ${SORIDORMI_RUNTIME_LOG_FORMAT:-mcap}
      SORIDORMI_RUNTIME_LOG_DIR: ${SORIDORMI_RUNTIME_LOG_DIR:-/data/logs}
      SORIDORMI_RUNTIME_LOG_EVERY_N: ${SORIDORMI_RUNTIME_LOG_EVERY_N:-1}
      SORIDORMI_RUNTIME_LOG_PREFIX: ${SORIDORMI_RUNTIME_LOG_PREFIX:-runtime}
      POLICY_PATH: /workspaces/Open_Duck_Mini/BEST_WALK_ONNX_2.onnx
      SORIDORMI_POLICY_PROFILE: ${SORIDORMI_POLICY_PROFILE:-}
      SORIDORMI_POLICY_PROFILE_FILE: ${SORIDORMI_POLICY_PROFILE_FILE:-}
      SORIDORMI_POLICY_PATH: ${SORIDORMI_POLICY_PATH:-/workspaces/Open_Duck_Mini/BEST_WALK_ONNX_2.onnx}
      SORIDORMI_POLICY_INPUT_NAME: ${SORIDORMI_POLICY_INPUT_NAME:-obs}
      SORIDORMI_POLICY_OUTPUT_NAME: ${SORIDORMI_POLICY_OUTPUT_NAME:-continuous_actions}
      SORIDORMI_POLICY_EXPECTED_INPUT_SHAPE: ${SORIDORMI_POLICY_EXPECTED_INPUT_SHAPE:-1,101}
      SORIDORMI_POLICY_EXPECTED_OUTPUT_SHAPE: ${SORIDORMI_POLICY_EXPECTED_OUTPUT_SHAPE:-1,14}
      SORIDORMI_POLICY_EXPECTED_INPUT_TYPE: ${SORIDORMI_POLICY_EXPECTED_INPUT_TYPE:-tensor(float)}
      SORIDORMI_POLICY_EXPECTED_OUTPUT_TYPE: ${SORIDORMI_POLICY_EXPECTED_OUTPUT_TYPE:-tensor(float)}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      SORIDORMI_ONNXRUNTIME_GPU: ${SORIDORMI_ONNXRUNTIME_GPU:-1}
      SORIDORMI_USE_CUDA_PROVIDER: ${SORIDORMI_USE_CUDA_PROVIDER:-1}
      SORIDORMI_ROBOT_CONFIG: ${SORIDORMI_ROBOT_CONFIG:-/app/configs/robots/open_duck_mini_v2.yaml}
      MUJOCO_MODEL_PATH: ${MUJOCO_MODEL_PATH:-}
      PYTHONUNBUFFERED: "1"
      SORIDORMI_COMMAND_X: ${SORIDORMI_COMMAND_X:-0.03}
      SORIDORMI_COMMAND_Y: ${SORIDORMI_COMMAND_Y:-0.0}
      SORIDORMI_COMMAND_YAW: ${SORIDORMI_COMMAND_YAW:-0.0}
      SORIDORMI_NECK_PITCH: ${SORIDORMI_NECK_PITCH:-0.0}
      SORIDORMI_HEAD_PITCH: ${SORIDORMI_HEAD_PITCH:-0.0}
      SORIDORMI_HEAD_YAW: ${SORIDORMI_HEAD_YAW:-0.0}
      SORIDORMI_HEAD_ROLL: ${SORIDORMI_HEAD_ROLL:-0.0}
      SORIDORMI_PHASE_FREQUENCY: ${SORIDORMI_PHASE_FREQUENCY:-1.0}
      SORIDORMI_PHASE_MODE: ${SORIDORMI_PHASE_MODE:-step}
      SORIDORMI_PHASE_PERIOD_STEPS: ${SORIDORMI_PHASE_PERIOD_STEPS:-auto}
      SORIDORMI_PHASE_REFERENCE_DATA: ${SORIDORMI_PHASE_REFERENCE_DATA:-/workspaces/Open_Duck_Playground/playground/open_duck_mini_v2/data/polynomial_coefficients.pkl}
      SORIDORMI_PHASE_REQUIRE_REFERENCE_DATA: ${SORIDORMI_PHASE_REQUIRE_REFERENCE_DATA:-0}
      SORIDORMI_PHASE_STEP_INCREMENT: ${SORIDORMI_PHASE_STEP_INCREMENT:-1.0}
      SORIDORMI_PHASE_ENABLED: ${SORIDORMI_PHASE_ENABLED:-1}
      SORIDORMI_PHASE_OFFSET: ${SORIDORMI_PHASE_OFFSET:-0.0}
      SORIDORMI_ACTION_SCALE: ${SORIDORMI_ACTION_SCALE:-0.20}
      SORIDORMI_MAX_MOTOR_VELOCITY: ${SORIDORMI_MAX_MOTOR_VELOCITY:-5.24}
      SORIDORMI_ACTION_POSTPROCESS: ${SORIDORMI_ACTION_POSTPROCESS:-0}
      SORIDORMI_ACTION_POSTPROCESS_MODE: ${SORIDORMI_ACTION_POSTPROCESS_MODE:-locomotion_boost}
      SORIDORMI_LEG_ACTION_GAIN: ${SORIDORMI_LEG_ACTION_GAIN:-1.0}
      SORIDORMI_HEAD_ACTION_GAIN: ${SORIDORMI_HEAD_ACTION_GAIN:-1.0}
      SORIDORMI_HIP_YAW_ACTION_GAIN: ${SORIDORMI_HIP_YAW_ACTION_GAIN:-1.0}
      SORIDORMI_HIP_ROLL_ACTION_GAIN: ${SORIDORMI_HIP_ROLL_ACTION_GAIN:-1.0}
      SORIDORMI_HIP_PITCH_ACTION_GAIN: ${SORIDORMI_HIP_PITCH_ACTION_GAIN:-1.0}
      SORIDORMI_KNEE_ACTION_GAIN: ${SORIDORMI_KNEE_ACTION_GAIN:-1.0}
      SORIDORMI_ANKLE_ACTION_GAIN: ${SORIDORMI_ANKLE_ACTION_GAIN:-1.0}
      SORIDORMI_ACTION_CLIP_ABS: ${SORIDORMI_ACTION_CLIP_ABS:-0.0}
      SORIDORMI_POLICY_ACCEL_BIAS_X: ${SORIDORMI_POLICY_ACCEL_BIAS_X:-1.3}
      SORIDORMI_POLICY_ACCEL_BIAS_Y: ${SORIDORMI_POLICY_ACCEL_BIAS_Y:-0.0}
      SORIDORMI_POLICY_ACCEL_BIAS_Z: ${SORIDORMI_POLICY_ACCEL_BIAS_Z:-0.0}
      SORIDORMI_USE_STATE_FEET_CONTACTS: ${SORIDORMI_USE_STATE_FEET_CONTACTS:-1}
      SORIDORMI_BOOTSTRAP_POLICY_DEFAULTS_FROM_STATE: ${SORIDORMI_BOOTSTRAP_POLICY_DEFAULTS_FROM_STATE:-1}
      SORIDORMI_COMMAND_RAMP_SECONDS: ${SORIDORMI_COMMAND_RAMP_SECONDS:-0.0}
      SORIDORMI_RESET_AT_START: ${SORIDORMI_RESET_AT_START:-0}
      SORIDORMI_SIM_SYNC_STEP: ${SORIDORMI_SIM_SYNC_STEP:-0}
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:${SORIDORMI_CONFIGS_MOUNT_MODE:-ro}
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./workspace/Open_Duck_Mini:/workspaces/Open_Duck_Mini
      - ./workspace/Open_Duck_Mini_Runtime:/workspaces/Open_Duck_Mini_Runtime
      - ./workspace/Open_Duck_Playground:/workspaces/Open_Duck_Playground
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /app
    command: bash

  sim:
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
      args:
        BASE_IMAGE: ${SIM_BASE:-nvidia/cuda:13.1.2-cudnn-devel-ubuntu24.04}
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
        USERNAME: ${CONTAINER_USER:-chromie}
    image: soridormi-sim:cuda13.1-cudnn
    container_name: soridormi-sim
    stdin_open: true
    tty: true
    init: true
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      MUJOCO_GL: glfw
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      SIM_HOST: 0.0.0.0
      SIM_PORT: ${SIM_PORT:-5555}
      SORIDORMI_SIM_BACKEND: ${SORIDORMI_SIM_BACKEND:-fake}
      SORIDORMI_MUJOCO_VIEWER: ${SORIDORMI_MUJOCO_VIEWER:-0}
      SORIDORMI_MUJOCO_ZERO_GRAVITY: ${SORIDORMI_MUJOCO_ZERO_GRAVITY:-0}
      SORIDORMI_MUJOCO_FIXED_BASE: ${SORIDORMI_MUJOCO_FIXED_BASE:-0}
      SORIDORMI_MUJOCO_USE_HOME_KEYFRAME: ${SORIDORMI_MUJOCO_USE_HOME_KEYFRAME:-0}
      SORIDORMI_MUJOCO_HOME_KEYFRAME_OVERRIDES_RESET_POSE: ${SORIDORMI_MUJOCO_HOME_KEYFRAME_OVERRIDES_RESET_POSE:-1}
      SORIDORMI_MUJOCO_OFFICIAL_RESET_SEQUENCE: ${SORIDORMI_MUJOCO_OFFICIAL_RESET_SEQUENCE:-0}
      SORIDORMI_MUJOCO_OFFICIAL_SENSOR_MODE: ${SORIDORMI_MUJOCO_OFFICIAL_SENSOR_MODE:-0}
      SORIDORMI_MUJOCO_OFFICIAL_CONTACT_MODE: ${SORIDORMI_MUJOCO_OFFICIAL_CONTACT_MODE:-0}
      SORIDORMI_AUTO_RESET: ${SORIDORMI_AUTO_RESET:-0}
      SORIDORMI_ROBOT_CONFIG: ${SORIDORMI_ROBOT_CONFIG:-/app/configs/robots/open_duck_mini_v2.yaml}
      MUJOCO_MODEL_PATH: ${MUJOCO_MODEL_PATH:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:${SORIDORMI_CONFIGS_MOUNT_MODE:-ro}
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./workspace/Open_Duck_Mini:/workspaces/Open_Duck_Mini
      - ./workspace/Open_Duck_Playground:/workspaces/Open_Duck_Playground
      - ./data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /app
    command: bash

  tensorboard:
    image: soridormi-sim:cuda13.1-cudnn
    container_name: soridormi-tensorboard
    depends_on:
      - sim
    network_mode: host
    volumes:
      - ./workspace/Open_Duck_Playground:/workspaces/Open_Duck_Playground
      - ./data:/data
    command: >
      bash -lc "source /opt/venvs/sim/bin/activate &&
      tensorboard --host 0.0.0.0 --port 6006
      --logdir /workspaces/Open_Duck_Playground,/data"
    profiles:
      - tools
