[project]
name = "soridormi"
version = "0.1.0"
description = "Sim-to-real Open Duck Mini v2 development stack for Jetson runtime and MuJoCo simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.6",
    "pyzmq>=25",
    "rich>=13",
    "PyYAML>=6",
]

[project.optional-dependencies]
runtime = [
    "onnxruntime>=1.16",
]
runtime-gpu = [
    "onnxruntime-gpu>=1.20",
]
sim = [
    "mujoco>=3.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
