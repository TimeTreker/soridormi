[project]
name = "soridormi"
version = "0.1.0"
description = "Sim-to-real Open Duck Mini v2 development stack for Jetson runtime and MuJoCo simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.6",
    "pyzmq>=25",
    "rich>=13",
    "PyYAML>=6",
    "mcap>=1.2",
]

[project.optional-dependencies]
runtime = [
    "onnxruntime>=1.16",
]
runtime-gpu = [
    "onnxruntime-gpu>=1.20",
]

training = [
    # PyTorch itself is installed from the selected CUDA wheel index by
    # docker/runtime/Dockerfile when RUNTIME_EXTRA contains "training".
    # Keeping it out of this extra avoids accidentally installing a CPU
    # or mismatched CUDA wheel from the default index.
    "onnx>=1.16",
]
sim = [
    "mujoco>=3.1",
    # Required for the official Open Duck Playground baseline runner.
    # The official baseline uses CPUExecutionProvider, so CPU ONNX Runtime is enough.
    "onnxruntime>=1.16",
    "etils>=1.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
