# Multi-behavior teacher suite for the pretrained Open Duck Mini v2 ONNX policy.
# This is not a new learned teacher model. It is a command-conditioned teacher
# data generator: the same pretrained policy is run under a broader command set.
name: open_duck_teacher_v1
description: >-
  Baseline command-conditioned teacher suite for stop, forward, fast-walk,
  turning, curved walking, lateral motion, and a head/neck bow cue.
base_profile: configs/policies/open_duck_forward.yaml
default_steps: 1000
default_require_provider: CUDAExecutionProvider
scenarios:
  - name: stop
    description: Zero joystick command; teacher should settle/stand still.
    tags: [stop, stand]
    steps: 500
    command:
      x: 0.0
      y: 0.0
      yaw: 0.0
      ramp_seconds: 0.2

  - name: walk_slow_forward
    description: Slow straight forward walking.
    tags: [walk, forward, slow]
    steps: 1000
    command:
      x: 0.05
      y: 0.0
      yaw: 0.0

  - name: walk_forward
    description: Default forward walking baseline.
    tags: [walk, forward]
    steps: 1000
    command:
      x: 0.15
      y: 0.0
      yaw: 0.0

  - name: fast_forward
    description: Fast forward walking command within the Open Duck joystick range.
    tags: [walk, forward, fast]
    steps: 1000
    command:
      x: 0.20
      y: 0.0
      yaw: 0.0

  - name: turn_left_in_place
    description: Positive yaw command with zero forward velocity.
    tags: [turn, yaw, left]
    steps: 1000
    command:
      x: 0.0
      y: 0.0
      yaw: 0.35

  - name: turn_right_in_place
    description: Negative yaw command with zero forward velocity.
    tags: [turn, yaw, right]
    steps: 1000
    command:
      x: 0.0
      y: 0.0
      yaw: -0.35

  - name: curve_left
    description: Forward walking while turning left.
    tags: [walk, turn, curve, left]
    steps: 1000
    command:
      x: 0.10
      y: 0.0
      yaw: 0.25

  - name: curve_right
    description: Forward walking while turning right.
    tags: [walk, turn, curve, right]
    steps: 1000
    command:
      x: 0.10
      y: 0.0
      yaw: -0.25

  - name: lateral_left
    description: Small positive lateral command.
    tags: [lateral, left]
    steps: 800
    command:
      x: 0.0
      y: 0.05
      yaw: 0.0

  - name: lateral_right
    description: Small negative lateral command.
    tags: [lateral, right]
    steps: 800
    command:
      x: 0.0
      y: -0.05
      yaw: 0.0

  - name: head_bow_cue
    description: >-
      Stationary head/neck bow cue. This is not a full-body bow skill; it only
      exercises the policy's head/neck command fields. A true full-body bow
      should be implemented as a Soridormi scripted skill later.
    tags: [gesture, bow, head, neck]
    steps: 500
    command:
      x: 0.0
      y: 0.0
      yaw: 0.0
      neck_pitch: 0.35
      head_pitch: 0.35
      ramp_seconds: 0.4
