# first-walk integration policy observation compatibility settings.
# Merge this into configs/robots/open_duck_mini_v2.yaml after inspecting it.
# These values mirror Open Duck Mini v2's MuJoCo inference assumptions.

policy_observation:
  # Open Duck's mujoco_infer.py adds +1.3 to accelerometer[0] before inference.
  accelerometer_bias_xyz: [1.3, 0.0, 0.0]

  # Prefer contacts reported by the simulator in RobotState.feet_contacts.
  use_state_feet_contacts: true

  foot_contact:
    # Open Duck's MJInferBase checks body contacts against floor.
    left_body: foot_assembly
    right_body: foot_assembly_2
    ground_body: floor

    # Fallback geom names from Open Duck constants.py.
    left_geoms: [left_foot_bottom_tpu]
    right_geoms: [right_foot_bottom_tpu]
    ground_geoms: [floor]
