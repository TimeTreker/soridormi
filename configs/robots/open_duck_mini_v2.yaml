robot_name: open_duck_mini_v2

model:
  path: /workspaces/Open_Duck_Playground/playground/open_duck_mini_v2/xmls/scene_flat_terrain.xml

simulation:
  substeps_per_api_step: 10

base:
  free_joint_name: floating_base
  qpos_xyz_slice: [0, 3]
  qpos_quat_wxyz_slice: [3, 7]
  qvel_linear_slice: [0, 3]
  qvel_angular_slice: [3, 6]

actuators:
  - name: left_hip_yaw
  - name: left_hip_roll
  - name: left_hip_pitch
  - name: left_knee
  - name: left_ankle
  - name: neck_pitch
  - name: head_pitch
  - name: head_yaw
  - name: head_roll
  - name: right_hip_yaw
  - name: right_hip_roll
  - name: right_hip_pitch
  - name: right_knee
  - name: right_ankle

control:
  mode: position
  clip_to_ctrlrange: true

imu:
  accel_xyz_default: [0.0, 0.0, 9.81]

viewer:
  enabled_env: SORIDORMI_MUJOCO_VIEWER
  sync_every_api_step: true
  show_left_ui: true
  show_right_ui: true

default_pose:
  positions:
    left_hip_yaw: 0.0
    left_hip_roll: 0.0
    left_hip_pitch: -0.15
    left_knee: 0.30
    left_ankle: -0.15

    neck_pitch: 0.0
    head_pitch: 0.0
    head_yaw: 0.0
    head_roll: 0.0

    right_hip_yaw: 0.0
    right_hip_roll: 0.0
    right_hip_pitch: 0.15
    right_knee: -0.30
    right_ankle: 0.15

  gains:
    kp_default: 10.0
    kd_default: 0.5

  torque_default: 0.0
