# Soridormi runnable policy engine policy profile.
name: open_duck_forward
description: Open Duck Mini v2 pretrained ONNX forward policy experiment.

model:
  path: /workspaces/Open_Duck_Mini/BEST_WALK_ONNX_2.onnx
  input_name: obs
  output_name: continuous_actions
  input_shape: [1, 101]
  output_shape: [1, 14]
  input_type: tensor(float)
  output_type: tensor(float)

runtime:
  mode: onnx_policy
  backend: sim
  control_hz: 50
  reset_at_start: true
  sync_step: true
  # Official Open Duck MjInfer waits one policy-control interval (10 MuJoCo
  # substeps) after applying the home keyframe before building the first policy
  # observation. Soridormi pre-rolls one synchronous API step to match that
  # startup timing and avoid feeding stale reset sensors/contacts into the ONNX
  # policy on step 0.
  sim_preroll_steps: 1

command:
  x: 0.15
  y: 0.0
  yaw: 0.0
  neck_pitch: 0.0
  head_pitch: 0.0
  head_yaw: 0.0
  head_roll: 0.0
  ramp_seconds: 0.0

phase:
  mode: step
  frequency: 1.0
  period_steps: auto
  reference_data: /workspaces/Open_Duck_Playground/playground/open_duck_mini_v2/data/polynomial_coefficients.pkl
  require_reference_data: true
  step_increment: 1.0
  enabled: true
  offset: 0.0

action_mapping:
  action_scale: 0.25
  max_motor_velocity: 5.24

observation:
  accel_bias_xyz: [1.3, 0.0, 0.0]
  use_state_feet_contacts: true
  bootstrap_policy_defaults_from_state: true

simulator:
  backend: mujoco
  use_home_keyframe: true
  home_keyframe_overrides_reset_pose: true
  official_reset_sequence: true
  official_sensor_mode: true
  official_contact_mode: true
  auto_reset: true
  viewer: true

logging:
  enabled: true
  format: mcap
  every_n: 1
  prefix: policy_open_duck_forward
